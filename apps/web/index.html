<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CutiTerbang</title>
    <script>
      // Terapkan tema pilihan pengguna sebelum cat pertama agar tidak berkedip. Tanpa kunci (pilihan
      // "Perangkat") atribut tidak dipasang, jadi prefers-color-scheme yang berlaku.
      try {
        var t = localStorage.getItem('cutiterbang-tema')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
